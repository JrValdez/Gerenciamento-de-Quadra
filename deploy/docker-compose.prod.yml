# Stack completa de produção: PostgreSQL + API .NET + Flutter Web (nginx).
# Exponha apenas o serviço "web" ao reverse proxy do host (subdomínio).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - quadra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend/QuadraApp.Api
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # Stack de instância única: aplica migração + seed no boot. Se um dia escalar a
      # API para mais de uma réplica, mude para "false" e rode as migrações num passo
      # separado do deploy (evita corrida entre instâncias subindo ao mesmo tempo).
      App__AutoMigrate: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: QuadraApp
      Jwt__Audience: QuadraApp
      Jwt__ExpiraMinutos: "480"
      App__AdminEmail: ${ADMIN_EMAIL}
      App__AdminPassword: ${ADMIN_PASSWORD}
      App__AppBaseUrl: ${APP_BASE_URL}
      Email__Smtp__Host: ${SMTP_HOST}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__User: ${SMTP_USER}
      Email__Smtp__Password: ${SMTP_PASSWORD}
      Email__Smtp__From: ${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend/quadra_app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  quadra_pgdata:
